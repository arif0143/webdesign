<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Work</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #fff; }
        .container { text-align: center; padding: 40px; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        p { color: #aaa; margin-bottom: 40px; font-size: 1.1rem; }
        .cards { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 40px 30px; width: 280px; text-decoration: none; color: #fff; transition: transform 0.3s, box-shadow 0.3s; }
        .card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.3); background: rgba(255,255,255,0.1); }
        .card h2 { font-size: 1.3rem; margin-bottom: 10px; }
        .card p { color: #888; font-size: 0.9rem; margin-bottom: 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Our Work</h1>
        <p>Check out our latest projects</p>
        <div class="cards">
            <a class="card" href="https://nimitt-consulting.vercel.app">
                <h2>Nimitt Consulting</h2>
                <p>Business consulting website</p>
            </a>
            <a class="card" href="https://ai-website-prompts.vercel.app">
                <h2>AI Website Prompts</h2>
                <p>AI-powered website prompts</p>
            </a>
            <a class="card" href="https://first-website.vercel.app">
                <h2>First Website</h2>
                <p>Starter website template</p>
            </a>
            <a class="card" href="https://startup-city-3d-demo.vercel.app">
                <h2>Startup City 3D</h2>
                <p>3D demo for startups</p>
            </a>
        </div>
    </div>
</body>
</html>

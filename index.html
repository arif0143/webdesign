<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Startup City — 3D Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#05060d;
    --panel-bg: rgba(11,13,24,0.78);
    --panel-border: rgba(255,255,255,0.09);
    --accent-green:#33e6a0;
    --accent-yellow:#d8ff4e;
    --text-dim:#8a92aa;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;font-family:'Sora',system-ui,-apple-system,sans-serif;
    background: linear-gradient(to bottom, #05060d 0%, #120a24 32%, #341a42 56%, #7a3a56 76%, #d98a5f 92%, #f2b073 100%);
  }
  #scene-canvas{position:fixed;inset:0;display:block;touch-action:none;cursor:grab;}
  #scene-canvas:active{cursor:grabbing;}

  .hud{position:fixed;z-index:5;color:#fff;}
  .top-left{top:20px;left:22px;}
  .wordmark{font-size:21px;font-weight:800;letter-spacing:-0.01em;display:flex;align-items:center;gap:8px;text-shadow:0 2px 18px rgba(0,0,0,0.5);}
  .wordmark .city{color:var(--accent-green);}
  .subline{margin-top:6px;font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:280px;}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;background:rgba(216,255,78,0.14);border:1px solid rgba(216,255,78,0.38);color:var(--accent-yellow);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;}

  .bottom-left{bottom:18px;left:22px;font-size:11.5px;color:rgba(255,255,255,0.55);}
  .bottom-right{bottom:18px;right:322px;font-size:11.5px;color:rgba(255,255,255,0.55);text-align:right;}
  .bottom-right b{color:#fff;}

  .panel{
    position:fixed;top:0;right:0;height:100%;width:300px;
    background:var(--panel-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-left:1px solid var(--panel-border);
    padding:22px 18px 18px;overflow-y:auto;z-index:6;
  }
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .panel h2{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin:0;font-weight:700;}
  .reset-btn{background:none;border:1px solid var(--panel-border);color:var(--text-dim);font-size:10.5px;padding:5px 9px;border-radius:7px;cursor:pointer;font-family:inherit;}
  .reset-btn:hover{color:#fff;border-color:rgba(255,255,255,0.25);}

  .card{
    border:1px solid var(--panel-border);border-radius:12px;padding:13px;margin-bottom:10px;
    background:rgba(255,255,255,0.03);transition:border-color .2s, background .2s;cursor:pointer;
  }
  .card.active{background:rgba(255,255,255,0.07);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .card-id{display:flex;gap:8px;align-items:flex-start;}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:5px;}
  .card-name{font-weight:700;font-size:14px;color:#fff;line-height:1.25;}
  .card-domain{font-size:11px;color:var(--text-dim);margin-top:2px;}
  .card-floors{margin-top:11px;font-size:10.5px;color:var(--text-dim);letter-spacing:.02em;text-transform:uppercase;}
  .card-floors b{color:#fff;font-size:13.5px;letter-spacing:0;text-transform:none;}
  .claim-btn{
    margin-top:10px;width:100%;padding:9px 0;border-radius:8px;border:none;
    background:var(--accent-yellow);color:#0a0e1a;font-weight:700;font-size:12px;font-family:inherit;
    cursor:pointer;transition:transform .12s, filter .12s;
  }
  .claim-btn:hover{filter:brightness(1.08);}
  .claim-btn:active{transform:scale(0.96);}
  .claim-btn.empty{background:rgba(255,255,255,0.06);border:1px dashed rgba(255,255,255,0.35);color:#fff;}

  .float-label{
    position:fixed;transform:translate(-50%,-100%);pointer-events:none;
    font-size:9.5px;font-weight:700;letter-spacing:.03em;color:#eafff0;
    background:rgba(6,9,18,0.7);border:1px solid rgba(255,255,255,0.16);
    padding:3px 7px;border-radius:6px;white-space:nowrap;z-index:4;
  }

  .map-toggle-btn{
    position:fixed;bottom:50px;left:22px;z-index:6;
    background:var(--panel-bg);border:1px solid var(--panel-border);color:#fff;
    font-family:inherit;font-size:12px;font-weight:600;padding:9px 14px;border-radius:9px;
    cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    display:flex;align-items:center;gap:6px;
  }
  .map-toggle-btn:hover{border-color:rgba(255,255,255,0.25);}

  .map-panel{
    position:fixed;bottom:96px;left:22px;z-index:7;
    width:min(320px,86vw);height:250px;
    background:var(--panel-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid var(--panel-border);border-radius:14px;overflow:hidden;
    display:flex;flex-direction:column;
    box-shadow:0 12px 40px rgba(0,0,0,0.4);
  }
  .map-panel[hidden]{display:none;}
  .map-panel-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 12px;font-size:11px;font-weight:700;letter-spacing:.03em;
    color:var(--text-dim);text-transform:uppercase;border-bottom:1px solid var(--panel-border);
    flex-shrink:0;
  }
  .map-close-btn{background:none;border:none;color:var(--text-dim);font-size:18px;line-height:1;cursor:pointer;padding:0 2px;}
  .map-close-btn:hover{color:#fff;}
  #leaflet-map{flex:1;background:#0a0e18;}

  .leaflet-popup-content-wrapper, .leaflet-popup-tip{background:#12162a;color:#fff;}
  .leaflet-popup-content{font-family:'Sora',system-ui,sans-serif;font-size:12.5px;margin:9px 11px;}
  .leaflet-popup-content b{display:block;font-size:13.5px;margin-bottom:2px;}
  .leaflet-container a.leaflet-popup-close-button{color:#8a92aa;}
  .leaflet-control-attribution{background:rgba(5,6,13,0.65)!important;color:#6a7186!important;font-size:8.5px!important;}
  .leaflet-control-attribution a{color:#8a92aa!important;}
  .leaflet-bar a{background:#12162a!important;color:#fff!important;border-bottom:1px solid var(--panel-border)!important;}
  .leaflet-bar a:hover{background:#1c2138!important;}

  @media (max-width:760px){
    .panel{width:100%;height:38%;top:auto;bottom:0;border-left:none;border-top:1px solid var(--panel-border);padding:16px 16px 14px;}
    .bottom-right{display:none;}
    .bottom-left{bottom:calc(38% + 10px);}
    .map-toggle-btn{bottom:calc(38% + 40px);}
    .map-panel{bottom:calc(38% + 86px);width:min(300px,84vw);height:220px;}
  }
</style>
</head>
<body>

<canvas id="scene-canvas"></canvas>

<div class="hud top-left">
  <div class="wordmark">Startup <span class="city">City</span></div>
  <div class="subline"><span class="badge">Demo preview</span>Interactive 3D concept — not the live product</div>
</div>

<div class="hud bottom-left">Drag to orbit · Scroll / pinch to zoom · Click a building to focus</div>
<div class="hud bottom-right">Buildings <b id="stat-buildings">–</b> &nbsp;·&nbsp; Floors sold <b id="stat-floors">–</b></div>

<button class="map-toggle-btn" id="map-toggle">🗺️ HQ map</button>
<div class="map-panel" id="map-panel" hidden>
  <div class="map-panel-head">
    <span>Startup HQ locations</span>
    <button class="map-close-btn" id="map-close">×</button>
  </div>
  <div id="leaflet-map"></div>
</div>

<div class="panel">
  <div class="panel-head">
    <h2>Claim a floor</h2>
    <button class="reset-btn" id="reset-view">Overview</button>
  </div>
  <div id="card-list"></div>
</div>

<div id="labels"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r127/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  "use strict";

  // ---------------- Data ----------------
  const FLOOR_H = 1.55;
  const BASE_H  = 1.0;

  const buildings = [
    {id:'hero',      name:'Your Product',   domain:'yourproduct.com', color:0x33e6a0, floors:12, x:0,    z:0,   w:4.4, d:4.4, empty:false, hq:{lat:37.7749, lng:-122.4194, city:'San Francisco, USA'}},
    {id:'saaskit',   name:'SaaS Kit',       domain:'saaskit.com',     color:0x8b6bff, floors:8,  x:-7.6, z:-2.4,w:3.2, d:3.2, empty:false, hq:{lat:30.2672, lng:-97.7431, city:'Austin, USA'}},
    {id:'designlab', name:'Design Lab',     domain:'designlab.com',   color:0xff9a3c, floors:6,  x:-12,  z:5.2, w:3.0, d:3.0, empty:false, hq:{lat:52.5200, lng:13.4050, city:'Berlin, Germany'}},
    {id:'nextstore', name:'Next Store',     domain:'nextstore.com',   color:0xff3c7d, floors:4,  x:8.6,  z:-1.6,w:3.0, d:3.0, empty:false, hq:{lat:1.3521, lng:103.8198, city:'Singapore'}},
    {id:'typeflow',  name:'Type Flow',      domain:'typeflow.com',    color:0x3c8bff, floors:3,  x:6.0,  z:6.6, w:2.8, d:2.8, empty:false, hq:{lat:6.5244, lng:3.3792, city:'Lagos, Nigeria'}},
    {id:'empty1',    name:'Claim this spot',domain:'—',               color:0x50607a, floors:0,  x:-2.4, z:9.6, w:3.0, d:3.0, empty:true, hq:null},
  ];

  function heightOf(b){ return b.empty && b.floors===0 ? 0.5 : BASE_H + b.floors*FLOOR_H; }
  function rgbStr(colorInt){ const r=(colorInt>>16)&255,g=(colorInt>>8)&255,b=colorInt&255; return `rgb(${r},${g},${b})`; }
  function darken(colorInt, f){ const r=(colorInt>>16)&255,g=(colorInt>>8)&255,b=colorInt&255; return `rgb(${Math.floor(r*f)},${Math.floor(g*f)},${Math.floor(b*f)})`; }

  // ---------------- Scene setup ----------------
  const canvas = document.getElementById('scene-canvas');
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x2f1740, 26, 72);

  const camera = new THREE.PerspectiveCamera(48, window.innerWidth/window.innerHeight, 0.1, 200);

  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);

  // Lights
  scene.add(new THREE.HemisphereLight(0x5a4fbf, 0x160b1e, 0.55));
  scene.add(new THREE.AmbientLight(0x6a5aa8, 0.3));
  const sun = new THREE.DirectionalLight(0xffb37a, 0.45);
  sun.position.set(-16, 22, 12);
  scene.add(sun);

  const pointLights = {};
  buildings.forEach(b=>{
    if(b.empty) return;
    const pl = new THREE.PointLight(b.color, 0.9, 15);
    pl.position.set(b.x, heightOf(b)*0.55, b.z + b.d*0.9);
    scene.add(pl);
    pointLights[b.id] = pl;
  });

  // Ground + grid
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(100,100),
    new THREE.MeshStandardMaterial({color:0x090b15, roughness:1, metalness:0})
  );
  ground.rotation.x = -Math.PI/2;
  scene.add(ground);

  const grid = new THREE.GridHelper(100, 50, 0x33406a, 0x161c30);
  grid.position.y = 0.01;
  scene.add(grid);

  // Trees for atmosphere
  function makeTree(x,z, s){
    s = s || 1;
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.07*s,0.09*s,0.55*s,6),
      new THREE.MeshStandardMaterial({color:0x2a1f18})
    );
    trunk.position.set(x, 0.27*s, z);
    const leaves = new THREE.Mesh(
      new THREE.ConeGeometry(0.48*s,1.05*s,7),
      new THREE.MeshStandardMaterial({color:0x0d3b2e, emissive:0x082418, emissiveIntensity:0.5})
    );
    leaves.position.set(x, 0.95*s, z);
    scene.add(trunk); scene.add(leaves);
  }
  const treeSpots = [[-4,-6],[3,-7],[-9,-5.5],[10,4],[-15,1],[2,11],[-6,12],[12,9],[-1,-11],[-13,8]];
  treeSpots.forEach(p=>makeTree(p[0],p[1], 0.9+Math.random()*0.5));

  // ---------------- Billboard texture ----------------
  function makeBillboardTexture(b){
    const c = document.createElement('canvas');
    c.width = 512; c.height = 320;
    const ctx = c.getContext('2d');

    if(b.empty){
      ctx.fillStyle = '#0e1220';
      ctx.fillRect(0,0,512,320);
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.setLineDash([14,10]);
      ctx.lineWidth = 5;
      ctx.strokeRect(16,16,480,288);
      ctx.setLineDash([]);
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.font = '700 40px Sora, Arial, sans-serif';
      ctx.fillText('CLAIM THIS', 256, 140);
      ctx.fillText('SPOT', 256, 190);
      ctx.font = '600 26px Sora, Arial, sans-serif';
      ctx.fillStyle = '#d8ff4e';
      ctx.fillText('from $1', 256, 240);
    } else {
      const grad = ctx.createLinearGradient(0,0,0,320);
      grad.addColorStop(0, rgbStr(b.color));
      grad.addColorStop(1, darken(b.color, 0.42));
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,512,320);

      ctx.globalAlpha = 0.07;
      ctx.fillStyle = '#000';
      for(let i=-320;i<512;i+=16){ ctx.fillRect(i,0,7,320); }
      ctx.globalAlpha = 1;

      let nameY = 150;
      if(b.id === 'hero'){
        ctx.font = '58px serif';
        ctx.textAlign = 'center';
        ctx.fillText('🚀', 256, 96);
        nameY = 200;
      }

      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.font = '800 46px Sora, Arial, sans-serif';
      const parts = b.name.split(' ');
      if(parts.length > 1){
        ctx.fillText(parts[0], 256, nameY);
        ctx.fillText(parts.slice(1).join(' '), 256, nameY+52);
        nameY += 52;
      } else {
        ctx.fillText(b.name, 256, nameY);
      }

      ctx.font = '500 22px Sora, Arial, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.88)';
      ctx.fillText(b.domain, 256, nameY + 48);
    }

    const tex = new THREE.CanvasTexture(c);
    tex.needsUpdate = true;
    return tex;
  }

  // ---------------- Building meshes ----------------
  const groups = {};

  function buildBuildingGroup(b){
    const height = heightOf(b);
    const geo = new THREE.BoxGeometry(b.w, height, b.d);

    const sideColor = b.empty ? 0x171d2e : 0x0b0f1c;
    const sideMat = new THREE.MeshStandardMaterial({
      color: sideColor, roughness: 0.85, metalness: 0.15,
      emissive: new THREE.Color(b.empty ? 0x000000 : b.color).multiplyScalar(0.05)
    });
    const billboardTex = makeBillboardTexture(b);
    const billboardMat = new THREE.MeshBasicMaterial(
      b.empty ? {color:0x171d2e, map:billboardTex, transparent:true, opacity:0.9} : {map:billboardTex}
    );
    // Box face order: +x, -x, +y, -y, +z, -z — billboard faces +z (toward viewer)
    const mats = [sideMat, sideMat, sideMat, sideMat, billboardMat, sideMat];

    const box = new THREE.Mesh(geo, mats);
    box.position.set(b.x, height/2, b.z);
    box.userData.buildingId = b.id;

    const edgeColor = b.empty ? 0x4a5570 : b.color;
    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(geo),
      new THREE.LineBasicMaterial({color:edgeColor, transparent:true, opacity:b.empty?0.55:0.85})
    );
    edges.position.copy(box.position);

    const group = new THREE.Group();
    group.add(box); group.add(edges);
    group.userData = {buildingId:b.id, box, edges, height, baseScale:1};
    return group;
  }

  buildings.forEach(b=>{
    const g = buildBuildingGroup(b);
    scene.add(g);
    groups[b.id] = g;
  });

  function disposeGroup(g){
    g.traverse(obj=>{
      if(obj.geometry) obj.geometry.dispose();
      if(obj.material){
        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
        mats.forEach(m=>{ if(m.map) m.map.dispose(); m.dispose(); });
      }
    });
  }

  function rebuildBuilding(b){
    const old = groups[b.id];
    scene.remove(old);
    disposeGroup(old);
    const ng = buildBuildingGroup(b);
    scene.add(ng);
    groups[b.id] = ng;

    const h = heightOf(b);
    if(pointLights[b.id]){
      pointLights[b.id].color.set(b.color);
      pointLights[b.id].position.set(b.x, h*0.55, b.z + b.d*0.9);
    } else if(!b.empty){
      const pl = new THREE.PointLight(b.color, 0.9, 15);
      pl.position.set(b.x, h*0.55, b.z + b.d*0.9);
      scene.add(pl);
      pointLights[b.id] = pl;
    }
  }

  // ---------------- Floating floor labels ----------------
  const labelsContainer = document.getElementById('labels');
  const labelEls = {};
  buildings.forEach(b=>{
    const el = document.createElement('div');
    el.className = 'float-label';
    labelsContainer.appendChild(el);
    labelEls[b.id] = el;
  });

  function updateLabels(){
    const v = new THREE.Vector3();
    buildings.forEach(b=>{
      const h = groups[b.id].userData.height;
      v.set(b.x, h + 0.85, b.z);
      v.project(camera);
      const el = labelEls[b.id];
      if(v.z > 1){ el.style.display = 'none'; return; }
      el.style.display = 'block';
      el.style.left = ((v.x*0.5+0.5)*window.innerWidth) + 'px';
      el.style.top = ((-v.y*0.5+0.5)*window.innerHeight) + 'px';
      el.textContent = b.empty ? 'AVAILABLE · FROM $1' : `FLOORS OWNED · ${b.floors}`;
    });
  }

  // ---------------- Camera orbit controls ----------------
  let theta = 0.62, phi = 1.0, radius = 34;
  let target = new THREE.Vector3(0, 3.2, 0);
  let goalTarget = target.clone();
  let goalRadius = radius;

  function updateCameraPosition(){
    camera.position.x = target.x + radius*Math.sin(phi)*Math.sin(theta);
    camera.position.z = target.z + radius*Math.sin(phi)*Math.cos(theta);
    camera.position.y = target.y + radius*Math.cos(phi);
    camera.lookAt(target);
  }
  updateCameraPosition();

  let dragging = false;
  let lastX = 0, lastY = 0, downX = 0, downY = 0;
  let lastInteract = performance.now();
  const pointers = {};
  let pinchStartDist = null, pinchStartRadius = radius;

  function dist(p1,p2){ return Math.hypot(p1.x-p2.x, p1.y-p2.y); }

  canvas.addEventListener('pointerdown', (e)=>{
    canvas.setPointerCapture(e.pointerId);
    pointers[e.pointerId] = {x:e.clientX, y:e.clientY};
    downX = e.clientX; downY = e.clientY;
    const ids = Object.keys(pointers);
    if(ids.length === 1){
      dragging = true; lastX = e.clientX; lastY = e.clientY;
    } else if(ids.length === 2){
      dragging = false;
      const pts = Object.values(pointers);
      pinchStartDist = dist(pts[0], pts[1]);
      pinchStartRadius = radius;
    }
    lastInteract = performance.now();
  });

  canvas.addEventListener('pointermove', (e)=>{
    if(!pointers[e.pointerId]) return;
    pointers[e.pointerId] = {x:e.clientX, y:e.clientY};
    const ids = Object.keys(pointers);
    if(ids.length === 2 && pinchStartDist){
      const pts = Object.values(pointers);
      const d = dist(pts[0], pts[1]);
      goalRadius = Math.max(10, Math.min(60, pinchStartRadius * (pinchStartDist/d)));
      radius = goalRadius;
    } else if(dragging){
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      theta -= dx*0.0062;
      phi = Math.max(0.32, Math.min(1.4, phi - dy*0.0062));
    }
    lastInteract = performance.now();
  });

  function endPointer(e){
    delete pointers[e.pointerId];
    const ids = Object.keys(pointers);
    if(ids.length < 2) pinchStartDist = null;
    if(ids.length === 0){
      const moved = Math.abs(e.clientX-downX) > 5 || Math.abs(e.clientY-downY) > 5;
      dragging = false;
      if(!moved) handleClick(e);
    }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  canvas.addEventListener('wheel', (e)=>{
    e.preventDefault();
    goalRadius = Math.max(10, Math.min(60, radius + e.deltaY*0.03));
    radius = goalRadius;
    lastInteract = performance.now();
  }, {passive:false});

  // ---------------- Raycast click-to-select ----------------
  const raycaster = new THREE.Raycaster();
  function handleClick(e){
    const rect = canvas.getBoundingClientRect();
    const mouse = new THREE.Vector2(
      ((e.clientX-rect.left)/rect.width)*2 - 1,
      -((e.clientY-rect.top)/rect.height)*2 + 1
    );
    raycaster.setFromCamera(mouse, camera);
    const meshes = buildings.map(b=>groups[b.id].userData.box);
    const hits = raycaster.intersectObjects(meshes);
    if(hits.length) selectBuilding(hits[0].object.userData.buildingId, true);
  }

  let selectedId = null;
  function selectBuilding(id, moveCamera){
    selectedId = id;
    if(moveCamera){
      const b = buildings.find(x=>x.id===id);
      const h = heightOf(b);
      goalTarget = new THREE.Vector3(b.x, h*0.5 + 0.6, b.z);
      goalRadius = Math.max(14, b.w*3.4);
    }
    refreshCards();
    syncMapSelection(id);
  }

  document.getElementById('reset-view').addEventListener('click', ()=>{
    selectedId = null;
    goalTarget = new THREE.Vector3(0, 3.2, 0);
    goalRadius = 34;
    refreshCards();
  });

  // ---------------- HQ map (Leaflet) ----------------
  let hqMap = null;
  const mapMarkers = {};

  function markerHtml(colorInt, big){
    return `<div style="width:${big?18:13}px;height:${big?18:13}px;border-radius:50%;
      background:${rgbStr(colorInt)};border:2px solid rgba(255,255,255,0.85);
      box-shadow:0 0 10px ${rgbStr(colorInt)};"></div>`;
  }

  function addMarker(b){
    if(!hqMap || !b.hq) return;
    const icon = L.divIcon({html:markerHtml(b.color,false), className:'', iconSize:[16,16], iconAnchor:[8,8]});
    const marker = L.marker([b.hq.lat, b.hq.lng], {icon}).addTo(hqMap);
    marker.bindPopup(`<b>${b.name}</b>${b.domain!=='—' ? b.domain+'<br>' : ''}${b.hq.city}`);
    marker.on('click', ()=> selectBuilding(b.id, true));
    mapMarkers[b.id] = marker;
  }

  function initMap(){
    if(hqMap) return;
    hqMap = L.map('leaflet-map', {zoomControl:true, attributionControl:true, worldCopyJump:true})
      .setView([20, 10], 1.6);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap contributors © CARTO',
      subdomains: 'abcd', maxZoom: 18
    }).addTo(hqMap);

    buildings.forEach(b=> addMarker(b));

    const pts = buildings.filter(b=>b.hq).map(b=>[b.hq.lat, b.hq.lng]);
    if(pts.length) hqMap.fitBounds(pts, {padding:[28,28], maxZoom:4});

    setTimeout(()=> hqMap.invalidateSize(), 60);
  }

  function syncMapSelection(id){
    if(!hqMap) return;
    Object.entries(mapMarkers).forEach(([bid, marker])=>{
      marker.setIcon(L.divIcon({
        html: markerHtml(buildings.find(x=>x.id===bid).color, bid===id),
        className:'', iconSize:[16,16], iconAnchor:[8,8]
      }));
    });
    const marker = mapMarkers[id];
    if(marker){
      hqMap.flyTo(marker.getLatLng(), Math.max(hqMap.getZoom(), 3), {duration:0.6});
      marker.openPopup();
    }
  }

  const mapToggleBtn = document.getElementById('map-toggle');
  const mapPanel = document.getElementById('map-panel');
  mapToggleBtn.addEventListener('click', ()=>{
    const opening = mapPanel.hasAttribute('hidden');
    if(opening){
      mapPanel.removeAttribute('hidden');
      initMap();
      setTimeout(()=> hqMap && hqMap.invalidateSize(), 30);
    } else {
      mapPanel.setAttribute('hidden','');
    }
  });
  document.getElementById('map-close').addEventListener('click', ()=> mapPanel.setAttribute('hidden',''));

  // ---------------- Claim mechanic ----------------
  const pulses = {};
  function pulseBuilding(id){ pulses[id] = performance.now(); }

  function claimFloor(id){
    const b = buildings.find(x=>x.id===id);
    if(b.empty){
      b.empty = false;
      b.floors = 1;
      b.name = 'New Startup';
      b.domain = 'yourdomain.com';
      b.color = 0xd8ff4e;
      b.hq = {lat:51.5074, lng:-0.1278, city:'London, UK'};
      addMarker(b);
    } else {
      b.floors += 1;
    }
    rebuildBuilding(b);
    pulseBuilding(b.id);
    selectBuilding(b.id, true);
    refreshCards();
    refreshStats();
  }

  // ---------------- Panel UI ----------------
  const cardList = document.getElementById('card-list');
  function refreshCards(){
    cardList.innerHTML = '';
    buildings.forEach(b=>{
      const card = document.createElement('div');
      card.className = 'card' + (selectedId===b.id ? ' active' : '');
      const cost = b.empty ? 1 : b.floors + 1;
      card.innerHTML = `
        <div class="card-top">
          <div class="card-id">
            <div class="dot" style="background:${rgbStr(b.color)}"></div>
            <div>
              <div class="card-name">${b.name}</div>
              <div class="card-domain">${b.empty ? 'Empty plot' : b.domain}${b.hq ? ' · '+b.hq.city : ''}</div>
            </div>
          </div>
        </div>
        <div class="card-floors">Floors owned&nbsp; <b>${b.floors}</b></div>
        <button class="claim-btn ${b.empty?'empty':''}" data-id="${b.id}">
          ${b.empty ? `Claim this spot — $${cost}` : `+ Claim a floor — $${cost}`}
        </button>
      `;
      card.addEventListener('click', (ev)=>{
        if(ev.target.classList.contains('claim-btn')) return;
        selectBuilding(b.id, true);
      });
      card.querySelector('.claim-btn').addEventListener('click', (ev)=>{
        ev.stopPropagation();
        claimFloor(b.id);
      });
      cardList.appendChild(card);
    });
  }

  function refreshStats(){
    document.getElementById('stat-buildings').textContent = buildings.length;
    document.getElementById('stat-floors').textContent = buildings.reduce((s,b)=>s+b.floors,0);
  }

  refreshCards();
  refreshStats();

  // ---------------- Resize ----------------
  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    if(hqMap) hqMap.invalidateSize();
  });

  // ---------------- Render loop ----------------
  function animate(){
    requestAnimationFrame(animate);

    const idle = performance.now() - lastInteract > 3200;
    if(idle && !dragging) theta += 0.0006;

    target.lerp(goalTarget, 0.07);
    radius += (goalRadius - radius) * 0.08;
    updateCameraPosition();
    updateLabels();

    const now = performance.now();
    Object.keys(pulses).forEach(id=>{
      const t = (now - pulses[id]) / 380;
      if(t >= 1){ delete pulses[id]; return; }
      const s = 1 + 0.05*Math.sin(t*Math.PI);
      const g = groups[id];
      if(g){ g.userData.box.scale.setScalar(s); g.userData.edges.scale.setScalar(s); }
    });

    renderer.render(scene, camera);
  }
  animate();

})();
</script>
</body>
</html>
